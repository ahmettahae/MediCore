services:
  # ── 1. Backend Web API (.NET 9 + SignalR + SQLite) ──
  - type: web
    name: medicore-api
    env: docker
    dockerfilePath: MediCore.API/Dockerfile
    dockerContext: MediCore.API
    plan: free
    region: frankfurt
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  # ── 2. Frontend (React 19 SPA) ──
  - type: web
    name: medicore-ui
    env: static
    rootDir: MediCore.UI
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
